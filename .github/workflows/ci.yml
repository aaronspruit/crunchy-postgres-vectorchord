---
# Builds every image that versions.yaml describes, and releases on a merge.
#
# A pull request builds every image and scans it, and pushes nothing. A merge
# to main that changed versions.yaml or the Dockerfile builds the images, pushes
# them under their version tags, and publishes a release. A merge that changed
# neither builds nothing, because the images would be identical.
#
# The release version is CalVer, `vYYYY.MM.DD`, with a `.N` suffix for a second
# release on the same day. It is a serial number for the changelog. Nothing
# pins to it. Consumers pin an image tag or a digest.
name: CI/CD

on:
  workflow_dispatch: {}
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  configure:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      notes: ${{ steps.plan.outputs.notes }}
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # The whole history and every tag. The plan below compares against
          # the last release and counts the releases of today.
          fetch-depth: 0

      # `yq` is part of the ubuntu-latest runner image. The script reads JSON,
      # which keeps it free of any YAML library.
      - name: Build the matrix
        id: matrix
        run: |
          set -euo pipefail
          matrix=$(yq -o=json -I=0 versions.yaml | python3 .github/scripts/build_matrix.py)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix" | python3 -m json.tool

      # The comparison runs against the last RELEASE, not the last commit. Two
      # merges between releases therefore both reach the notes, and a release
      # that failed after its merge is retried by the next one.
      - name: Plan the release
        id: plan
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          last=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          echo "Last release: ${last:-<none>}"

          dockerfile_changed=""
          if [ -z "$last" ]; then
            # No release yet, so everything in versions.yaml is new.
            release=true
            old=-
          else
            old=/tmp/old-versions.yaml
            git show "$last:versions.yaml" > "$old"
            release=false
            git diff --quiet "$last" HEAD -- versions.yaml Dockerfile || release=true
            git diff --quiet "$last" HEAD -- Dockerfile || dockerfile_changed=--dockerfile-changed
          fi
          # A manual run rebuilds and republishes on demand. This is an `if`
          # rather than a `[ ... ] &&`, which would end the script under `set -e`
          # on every run that is not a manual one.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            release=true
          fi

          echo "release=$release" >> "$GITHUB_OUTPUT"
          if [ "$release" != "true" ]; then
            echo "versions.yaml and the Dockerfile are unchanged since $last. No release."
            exit 0
          fi

          # CalVer. The first release of a day takes the bare date.
          date=$(date -u +%Y.%m.%d)
          version="$date"
          if git rev-parse -q --verify "refs/tags/v$date" >/dev/null; then
            n=2
            while git rev-parse -q --verify "refs/tags/v$date.$n" >/dev/null; do
              n=$((n + 1))
            done
            version="$date.$n"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release version: v$version"

          notes=$(python3 .github/scripts/version_diff.py "$old" versions.yaml $dockerfile_changed \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["markdown"])')
          {
            echo 'notes<<RELEASE_NOTES'
            echo "$notes"
            echo 'RELEASE_NOTES'
          } >> "$GITHUB_OUTPUT"
          echo "$notes"

  # Labels the pull request by what it changes, so the release notes group it
  # correctly later. The same script decides the label and writes the notes, so
  # the two can never disagree.
  label:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Label the versions that changed
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git show "$BASE:versions.yaml" > /tmp/old-versions.yaml

          dockerfile_changed=""
          git diff --quiet "$BASE" HEAD -- Dockerfile || dockerfile_changed=--dockerfile-changed

          result=$(python3 .github/scripts/version_diff.py \
            /tmp/old-versions.yaml versions.yaml $dockerfile_changed)
          echo "$result" | python3 -m json.tool

          labels=$(echo "$result" | python3 -c 'import json,sys; print(",".join(json.load(sys.stdin)["labels"]))')
          if [ -z "$labels" ]; then
            echo "No version or build change. No label."
            exit 0
          fi
          gh pr edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "$labels"
          echo "Applied: $labels"

  build:
    runs-on: ubuntu-latest
    needs: configure
    # A merge that changed no image has nothing to build. A pull request always
    # builds, because verifying the build is the point of the pull request.
    if: github.event_name == 'pull_request' || needs.configure.outputs.release == 'true'
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
      security-events: write
    strategy:
      # One broken image must not stop the other builds.
      fail-fast: false
      matrix: ${{ fromJson(needs.configure.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Name the image
        id: image
        run: |
          set -euo pipefail
          echo "name=ghcr.io/${GITHUB_REPOSITORY}${{ matrix.image_suffix }}" >> "$GITHUB_OUTPUT"
          echo "cell=${{ matrix.variant }}-${{ matrix.cdpg }}-${{ matrix.vectorchord }}" >> "$GITHUB_OUTPUT"

      # The version is known before the build, so the images carry their final
      # tags at once and nothing is retagged afterwards.
      #
      # `<cdpg>-<vchord>` and `<pg_major>-<vchord>` name an extension version,
      # so every cell claims its own. The bare `<cdpg>` and `<pg_major>` tags
      # name none, so only the newest extension version may claim them. Two
      # cells that claimed one of these would race, and the winner would be
      # whichever job finished last.
      - name: Generate the image metadata
        id: metadata
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ matrix.cdpg }}-${{ matrix.vectorchord }}
            type=raw,value=${{ matrix.pg_major }}-${{ matrix.vectorchord }}
            type=raw,value=${{ matrix.cdpg }},enable=${{ matrix.is_newest_vectorchord }}
            type=raw,value=${{ matrix.pg_major }},enable=${{ matrix.is_newest_vectorchord }}
            type=raw,value=latest,enable=${{ matrix.is_latest }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=${{ steps.image.outputs.cell }}
          cache-to: type=gha,mode=max,scope=${{ steps.image.outputs.cell }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            CDPG_IMAGE=${{ matrix.base_image }}
            CDPG_TAG=${{ matrix.cdpg }}
            VECTORCHORD_TAG=${{ matrix.vectorchord }}

      # A pull request pushes nothing, so the smoke test and the scan need a
      # local image. This build reads the cache that the build above wrote, so
      # it repeats no work. It covers linux/amd64 only, because `load` takes one
      # platform, and the build above already proves that linux/arm64 builds.
      - name: Load the image for testing
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ steps.image.outputs.name }}:pr-test
          cache-from: type=gha,scope=${{ steps.image.outputs.cell }}
          build-args: |
            CDPG_IMAGE=${{ matrix.base_image }}
            CDPG_TAG=${{ matrix.cdpg }}
            VECTORCHORD_TAG=${{ matrix.vectorchord }}

      - name: Name the image under test
        id: subject
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ref=${{ steps.image.outputs.name }}:pr-test" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"
          fi

      # The build reports a skipped major and still succeeds, because one major
      # without a VectorChord release must not fail an upgrade image that holds
      # four. This test asserts the other side of that rule: every major in the
      # finished image carries the extension.
      - name: Smoke test the image
        env:
          IMAGE: ${{ steps.subject.outputs.ref }}
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh --user root "$IMAGE" -c '
            set -eu
            for pg_config in /usr/pgsql-*/bin/pg_config; do
              lib=$("$pg_config" --pkglibdir)
              share=$("$pg_config" --sharedir)
              if [ ! -f "$lib/vchord.so" ] || [ ! -f "$share/extension/vchord.control" ]; then
                echo "vchord is absent from $pg_config" >&2
                exit 1
              fi
              echo "vchord is present for $pg_config"
            done'

      # Trivy reports and never fails the build. Every finding belongs to the
      # Crunchy base image, which this repository cannot patch. The answer to
      # one is a newer Crunchy tag in versions.yaml, which version-check.yml
      # already proposes. A gate would hold releases for work that nobody here
      # can do. The findings go to code scanning so that they are visible.
      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.subject.outputs.ref }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          limit-severities-for-sarif: true
          exit-code: '0'

      # The scan must not decide whether a build passes, and neither must the
      # upload of its results. Code scanning that is switched off, or a SARIF
      # file that the API rejects, is a reason to lose the report and nothing
      # more.
      - name: Upload the scan results
        uses: github/codeql-action/upload-sarif@0499de31b99561a6d14a36a5f662c2a54f91beee # v4.31.2
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
          category: trivy-${{ steps.image.outputs.cell }}

      - name: Generate the attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # `tags` holds one tag for each line. It reaches the script through the
      # environment, because a multi-line value pasted into the script itself
      # splits the statement that holds it across lines.
      - name: Report the tags
        if: github.event_name != 'pull_request'
        env:
          CELL: ${{ steps.image.outputs.cell }}
          REFERENCE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          {
            echo "### $CELL"
            echo
            echo '```'
            echo "$REFERENCE"
            echo '```'
            echo
            echo "$TAGS" | sed 's/^/- `/; s/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    runs-on: ubuntu-latest
    # A failure in any matrix cell leaves `build` failed, which skips this job.
    # A release covers every image or none.
    needs: [configure, build]
    if: github.event_name != 'pull_request' && needs.configure.outputs.release == 'true'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Write the release notes
        env:
          NOTES: ${{ needs.configure.outputs.notes }}
          MATRIX: ${{ needs.configure.outputs.matrix }}
        run: |
          set -euo pipefail
          {
            echo "## What's in this release"
            echo
            echo "$NOTES"
            echo
            echo "## Images"
            echo
            echo '```'
            echo "$MATRIX" | jq -r '.include[]
              | "ghcr.io/${{ github.repository }}\(.image_suffix):\(.pg_major)-\(.vectorchord)"'
            echo '```'
          } > release-notes.md
          cat release-notes.md

      # `generate_release_notes` adds the "What's Changed" list of merged pull
      # requests under this body, grouped by the categories in
      # .github/release.yml. The tag is created on this commit.
      - name: Publish the release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: v${{ needs.configure.outputs.version }}
          name: v${{ needs.configure.outputs.version }}
          body_path: release-notes.md
          generate_release_notes: true
          make_latest: true
